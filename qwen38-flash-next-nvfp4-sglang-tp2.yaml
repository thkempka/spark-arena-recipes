# Qwen3.8-Flash-Next-NVFP4 (RadixArk) - SGLang TP2 across ws01+ws02 (2x DGX Spark / GB10)
#
# Serves RadixArk/Qwen3.8-Flash-Next-NVFP4 (~125B-A3B hybrid MoE + 51B n-gram PLE
# embedding + in-checkpoint 4B MTP head, arch qwen4_exp) with SGLang, tensor-parallel
# 2 over the existing 2-node CX7 RoCE rail.
#
# CONFIG (2026-08-27) - CANONICAL / BULLETPROOF = tony2wild HEAD flags, graphs OFF + radix ON.
#   This IS the default recipe file name (qwen38-flash-next-nvfp4-sglang-tp2.yaml).
#   The graphs-ON ~70-class config is kept as qwen38-flash-next-nvfp4-sglang-tp2-graphs-
#   experimental.yaml - it is NOT the submission default (it reproducibly NaN-asserts).
#   Recreates the 2026-08-26 "fast + stable + context cache" day-0 regime, which is also
#   tonyd2wild's own documented bulletproof fallback (MTP4 graphs-off ~55 peak / ~33 typ).
#     - --disable-cuda-graph: no graph-captured decode/sampling path. EVERY observed crash
#       of the 70-class config reported today (incl. with tony2wild exact flags at 17:52;
#       the retained log captures 1 such assert + scheduler Traceback) fired
#       on 'cuda graph: True' decode batches -> 'probability tensor contains inf/nan'
#       assert (torch.multinomial on NaN logits). Graphs off removes that whole class.
#     - radix cache ON (no --disable-radix-cache): context/prefix cache back (agent loops
#       with repeated prompts get cached-token hits -> faster), and mamba pool auto-sizes
#       to 97 anyway; we still pin --max-mamba-cache-size 97 explicitly.
#     - Everything else == tony2wild launch-qwen38fn-sglang-tp2.sh exactly:
#       mem 0.80 + 600K pin, NEXTN/MTP4 3/1/4 + ReplaySSM, --speculative-attention-mode
#       decode, --disable-prefill-cuda-graph, --ple-offload-embedding, sampler pytorch,
#       thinking-off, mrope-patched image (no day-0 mrope assert).
#
#   VERIFIED 2026-08-27 (ws01+ws02, live server): STABLE + CONTEXT CACHE ON.
#     0 log errors (no inf/nan, assert, Traceback, CUDA error, OOM); /health 200;
#     cache_hit_rate=0.944, prefill_cache=2.32M tokens, evicted=64 (pin right-sized);
#     repeated 6420-token prompt 2.25s cold -> 0.25s warm (~9x). See README
#     'Verified: bulletproof config...' section for the full evidence + how to rerun.
#
#     - --sampling-backend pytorch, explicit --ple-offload-embedding
#     - agent-safe: --tool-call-parser qwen3_coder + thinking-off default (sglang#36537).
#       OPERATIONAL RULE: keep agent temperature <= 0.7.
#   Vision stays FULL multimodal (no language_model_only).
#
# IMAGE: qwen38-flashnext-dspark:local - built from lmsysorg/sglang:qwen38flashnext +
# MiaAI-Lab's SM121 Triton QSA fallback (graph-safe kernel). Already on ws01 + ws02
# (identical image ID; sparkrun auto-distributes at run time anyway):
#   docker pull lmsysorg/sglang:qwen38flashnext                    (done, ws01)
#   cd ~/spark-arena-recipes/docker/qwen38-flashnext && docker build \
#     --build-arg BASE_IMAGE=lmsysorg/sglang:qwen38flashnext -t qwen38-flashnext-dspark:local .
#
# RUN (from ws01, head/rank 0; ws02 needs no recipe file - sparkrun pushes):
#   sparkrun run qwen38-flash-next-nvfp4-sglang-tp2.yaml --cluster wc
#   BEFORE EACH LAUNCH (both nodes, mandatory per upstream): drop the page cache:
#     sudo sh -c 'sync; echo 3 > /proc/sys/vm/drop_caches'
#
# Rails: wc cluster manifest has CX7 subnets 192.168.0.0/24 + 192.168.1.0/24
# (netplan /etc/netplan/40-cx7.yaml). Primary rail = enp1s0f0np0/rocep1s0f0
# (192.168.0.50 <-> 192.168.0.49), RoCE GID index 3.
#
# YaRN LATER (flag-only, no image rebuild / no re-download): step
# --context-length 262144 -> 900000 and --chunked-prefill-size 4096 -> 1024
# (and re-check the 600K/token pin). Only worth it if you feed >262k-token prompts.
#
# EXPERIMENTAL ALTERNATIVE (NOT recommended): qwen38-flash-next-nvfp4-sglang-tp2-
#   graphs-experimental.yaml keeps CUDA graphs ON + --disable-radix-cache for ~70 peak
#   tok/s. It loses the context cache AND hit the 'probability tensor contains inf/nan'
#   scheduler assert on a 'cuda graph: True' decode batch (17:52, same day). Kept only
#   as an upper bound reference; do not submit it.
#
# CREDITS: MiaAI-Lab/Qwen3.8-Flash-Next-Dual-DGX-Sparks (SM121 kernel work + tuning),
# tonyd2wild/Qwen3.8-Flash-Next-NVFP4-DGX-Spark + -Fleet-Deploy (locked config,
# stability/OOM fixes, agent-safe flags), sgl-project/sglang#36537 (agent loop fix),
# RadixArk/Qwen3.8-Flash-Next-NVFP4 (weights), NVIDIA DGX Spark forum threads.
recipe_version: "2"
model: RadixArk/Qwen3.8-Flash-Next-NVFP4
runtime: sglang
builder: eugr
min_nodes: 2
max_nodes: 2

container: qwen38-flashnext-dspark:local

metadata:
  description: >-
    RadixArk/Qwen3.8-Flash-Next-NVFP4 (qwen4_exp) served by SGLang TP=2 on the
    2-node cluster (ws01+ws02). CANONICAL submission config = the bulletproof
    regime (yesterday's stable one): tony2wild-exact flags minus one -- CUDA graphs OFF +
    radix/context cache ON. VERIFIED stable with 94% context-cache hit rate.
    NEXTN/MTP4 3/1/4 + replay-ssm, mem 0.80 + 600K-token KV pin (OOM-safe),
    max-mamba-cache-size 97, agent-safe parser/thinking-off, ~55 tok/s peak /
    ~33 typical, no graph-capture NaN-assert class. Runs on the patched image.
  runtime: sglang
  topology: 2x DGX Spark, TP=2
  context: 262144 native (YaRN 900000 optional, flag-only)

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  pipeline_parallel: 1
  served_model_name: Qwen3.8-Flash-Next-NVFP4

executor_config:
  shm_size: 32gb
  network: host
  ipc: host

env:
  # weights already local on both nodes (~/.cache/huggingface -> /cache/huggingface)
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  # GB10 kernel arches
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  # NCCL over the existing CX7 RoCE rail (enp1s0f0np0 / rocep1s0f0, GID index 3)
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_HCA: rocep1s0f0
  NCCL_IB_GID_INDEX: "3"
  NCCL_SOCKET_IFNAME: enp1s0f0np0
  GLOO_SOCKET_IFNAME: enp1s0f0np0
  NCCL_MAX_NCHANNELS: "4"
  NCCL_MIN_NCHANNELS: "4"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"

command: |-
  python3 -m sglang.launch_server \
      --model-path {model} \
      --served-model-name {served_model_name} \
      --trust-remote-code \
      --tp-size {tensor_parallel} \
      --quantization modelopt_fp4 \
      --fp4-gemm-backend flashinfer_cutlass \
      --page-size 64 \
      --mamba-scheduler-strategy extra_buffer \
      --mamba-track-interval 64 \
      --max-mamba-cache-size 97 \
      --speculative-algorithm NEXTN \
      --speculative-num-steps 3 \
      --speculative-eagle-topk 1 \
      --speculative-num-draft-tokens 4 \
      --enable-linear-replayssm-spec \
      --speculative-attention-mode decode \
      --chunked-prefill-size 4096 \
      --max-running-requests 6 \
      --context-length 262144 \
      --max-total-tokens 600000 \
      --mem-fraction-static 0.80 \
      --allow-auto-truncate \
      --reasoning-parser auto \
      --tool-call-parser qwen3_coder \
      --default-chat-template-kwargs '{"enable_thinking": false}' \
      --ple-offload-embedding \
      --disable-cuda-graph \
      --disable-prefill-cuda-graph \
      --sampling-backend pytorch \
      --enable-metrics \
      --host {host} --port {port}
