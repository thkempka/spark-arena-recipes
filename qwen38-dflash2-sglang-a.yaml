# Qwen3.8-27B NVFP4 + DFlash2 (SGLang) - SOLO self-contained (Option A)
# Self-contained for Spark Arena / clean checkout:
#  * chat-template-sglang.jinja EMBEDDED (base64) in pre_exec -> /out/chat-template-sglang.jinja
#  * API key from QWEN38_API_KEY env var (set by runner), no host file
#  * no host-dir mounts needed
# Usage: QWEN38_API_KEY=... sparkrun run this.yaml --solo
recipe_version: "2"
model: RadixArk/Qwen3.8-27B-NVFP4
runtime: sglang
builder: eugr
min_nodes: 1
max_nodes: 1

container: qwen38-dflash2:v1.2.2

metadata:
  description: >-
    Qwen3.8-27B NVFP4 served via SGLang with DFlash2 speculative decoding
    (z-lab draft, k=8) on a single DGX Spark (tp=1). Self-contained variant:
    chat template embedded, API key from env.
  drafter: z-lab/Qwen3.8-27B-DFlash2

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 1
  served_model_name: qwen3.8-27b
  draft2_rev: 50307d4c4cde6860d4eee73e2547cd786fe8e8a4

speculative_draft_model_path: z-lab/Qwen3.8-27B-DFlash2

executor_config:
  # Option A: no host volumes; chat template materialized by pre_exec
  memory_limit: 100g
  shm_size: 16gb
  network: host
  ipc: host

env:
  TORCHINDUCTOR_CACHE_DIR: /cache/inductor
  HF_HOME: /cache/huggingface
  HF_HUB_ENABLE_HF_TRANSFER: "0"

pre_exec:
  # Materialize the embedded chat template inside the container (no host dep).
  - |
    set -eu
    mkdir -p /out
    echo "" | base64 -d > /out/chat-template-sglang.jinja
    test -s /out/chat-template-sglang.jinja || { echo "FATAL: template decode failed"; exit 1; }
    echo "[a] chat-template-sglang.jinja materialized in $(hostname)"

command: |-
  python3 -m sglang.launch_server \
      --trust-remote-code --model-path {model} --tp-size {tensor_parallel} \
      --served-model-name {served_model_name} \
      --mem-fraction-static 0.50 \
      --attention-backend flashinfer --chunked-prefill-size 8192 \
      --disable-prefill-cuda-graph --cuda-graph-max-bs 8 \
      --disable-flashinfer-autotune \
      --speculative-algorithm DFLASH \
      --speculative-draft-model-path z-lab/Qwen3.8-27B-DFlash2 \
      --speculative-draft-model-revision {draft2_rev} \
      --speculative-num-draft-tokens 8 --speculative-draft-model-quantization unquant \
      --mamba-radix-cache-strategy extra_buffer --mamba-ssm-dtype bfloat16 \
      --max-mamba-cache-size 96 --max-running-requests 8 \
      --enable-torch-compile --torch-compile-max-bs 4 \
      --num-continuous-decode-steps 2 \
      --mm-feature-transport cpu \
      --reasoning-parser qwen3 --tool-call-parser qwen3_coder \
      --chat-template /out/chat-template-sglang.jinja \
      --sleep-on-idle \
      --api-key "${QWEN38_API_KEY:?set QWEN38_API_KEY env}" \
      --host {host} --port {port}
