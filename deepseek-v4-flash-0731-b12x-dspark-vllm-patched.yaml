recipe_version: '2'
model: deepseek-ai/DeepSeek-V4-Flash-0731
runtime: vllm
builder: eugr
min_nodes: 2
container: ghcr.io/spark-arena/dgx-vllm-eugr-nightly-b12x@sha256:af9629c5bc9f5edc1b478a996cf4aa4304311524f31e61ab66e59fce8ff8fd02
metadata:
  description: vLLM serving deepseek-ai/DeepSeek-V4-Flash-0731 on a dual Sparks using
    B12X docker
mods:
- mods/instanttensor-hybrid-draft-loader
pre_exec:
  # Self-contained injection of the 0005 stop-in-reasoning detokenizer patch.
  # Writes the pre-patched detokenizer.py over the image's stock file in EVERY
  # container at start (like the nvfp4 recipe's in-container overlay). No external
  # file, no wrapper, no volume mount required on the hosts.
  - |
    set -eu
    
    echo "$B64" | base64 -d > /usr/local/lib/python3.12/dist-packages/vllm/v1/engine/detokenizer.py
    chmod 644 /usr/local/lib/python3.12/dist-packages/vllm/v1/engine/detokenizer.py
    grep -q "stop-in-reasoning" /usr/local/lib/python3.12/dist-packages/vllm/v1/engine/detokenizer.py || { echo "FATAL: detokenizer patch not applied"; exit 1; }
    echo "[detokenizer] 0005 patch applied (stop-in-reasoning) in $(hostname)"

defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  kv_cache_dtype: fp8
  max_model_len: auto
  block_size: 256
  max_num_seqs: 8
  max_num_batched_tokens: 8192
  max_cudagraph_capture_size: 64
  num_speculative_tokens: 5
  thinking: 'true'
  reasoning_effort: high
env:
  CUTE_DSL_ARCH: sm_121a
  VLLM_USE_AOT_COMPILE: '1'
  VLLM_USE_BREAKABLE_CUDAGRAPH: '0'
  VLLM_USE_MEGA_AOT_ARTIFACT: '-1'
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: '1'
  VLLM_USE_FLASHINFER_SAMPLER: '1'
  VLLM_USE_B12X_WO_PROJECTION: '1'
  VLLM_USE_B12X_MHC: '1'
  VLLM_USE_B12X_FP8_GEMM: '1'
  VLLM_USE_B12X_MOE: '1'
  VLLM_USE_B12X_SPARSE_INDEXER: '1'
  VLLM_MOE_SKIP_PADDING: '0'
  VLLM_USE_V2_MODEL_RUNNER: '1'
  B12X_MLA_SM120_UNIFIED: '1'
  B12X_MOE_FORCE_A8: '1'
command: |-
  vllm serve {model} \
      --host {host} \
      --port {port} \
      --trust-remote-code \
      --tensor-parallel-size {tensor_parallel} \
      --kv-cache-dtype {kv_cache_dtype} \
      --block-size {block_size} \
      --max-model-len {max_model_len} \
      --max-num-seqs {max_num_seqs} \
      --max-num-batched-tokens {max_num_batched_tokens} \
      --gpu-memory-utilization {gpu_memory_utilization} \
      --enable-prefix-caching \
      --tokenizer-mode deepseek_v4 \
      --tool-call-parser deepseek_v4 \
      --enable-auto-tool-choice \
      --reasoning-parser deepseek_v4 \
      --reasoning-config '{"reasoning_parser":"deepseek_v4","reasoning_start_str":"","reasoning_end_str":""}' \
      --default-chat-template-kwargs.thinking={thinking} \
      --default-chat-template-kwargs.reasoning_effort={reasoning_effort} \
      --load-format instanttensor \
      --moe-backend b12x \
      --linear-backend b12x \
      --attention-backend B12X_MLA_SPARSE \
      --max-cudagraph-capture-size {max_cudagraph_capture_size} \
      --compilation-config '{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}' \
      --speculative-config '{"method":"dspark","num_speculative_tokens":{num_speculative_tokens},"draft_sample_method":"probabilistic","attention_backend":"B12X_MLA_SPARSE"}'

